# Render Blueprint — deploys the EduEvent Spring Boot app as a Docker web service.
# In Render: New → Blueprint → connect this repo. Then set the 3 secret env vars.
services:
  - type: web
    name: eduevent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /index.html
    autoDeploy: true
    envVars:
      - key: MONGODB_URI      # MongoDB Atlas connection string
        sync: false
      - key: JWT_SECRET       # random 32+ char string (generate one)
        generateValue: true
      - key: MAIL_USERNAME    # Gmail address for outgoing mail
        sync: false
      - key: MAIL_PASSWORD    # Gmail app password (16 chars)
        sync: false
      - key: APP_BASE_URL     # public URL once known (e.g. https://eduevent.me)
        sync: false
