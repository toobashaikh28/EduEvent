# ─────────────────────────────────────────────────────────────────────────────
# EduEvent — application.properties (SAFE TO COMMIT)
#
# Sensitive values are read from environment variables.
# Set these before running the app:
#
#   DB_PASSWORD       your SQL Server password
#   JWT_SECRET        a random string of 32+ characters
#   MAIL_USERNAME     your Gmail address
#   MAIL_PASSWORD     your 16-char Google App Password (not your Gmail password)
#
# In IntelliJ: Run > Edit Configurations > Environment Variables
# On the command line:
#   export DB_PASSWORD=yourpassword && mvn spring-boot:run
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=EduEvent

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=eduevent;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
app.base-url=http://localhost:8080

# ── File uploads ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ── Email (Gmail SMTP) ────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
