spring.application.name=EduEvent

# ── Database (MongoDB) ────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/eduevent}
spring.data.mongodb.auto-index-creation=true

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ── Web form binding (event create/edit sends datetime-local values) ──────────
spring.mvc.format.date-time=iso
spring.mvc.format.date=iso

# ── File uploads ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# ── Email (Gmail SMTP) ────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── Performance ───────────────────────────────────────────────────────────────
# Gzip JSON/HTML/CSS/JS responses (pages are ~200 KB uncompressed)
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,text/plain

# Let browsers reuse CSS/JS/HTML for 10 minutes instead of re-downloading on every click
spring.web.resources.cache.cachecontrol.max-age=600
spring.web.resources.cache.cachecontrol.cache-public=true

# Small container: fewer threads = less memory / less GC pressure
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=4
spring.jmx.enabled=false
spring.main.banner-mode=off

# ── Mail timeouts ─────────────────────────────────────────────────────────────
# Default is "wait forever". Fail fast instead so nothing hangs on a blocked SMTP port.
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
