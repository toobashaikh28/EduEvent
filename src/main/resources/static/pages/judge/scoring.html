<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>EduEvent Judge — Scoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../../css/global.css" />
    <style>
      .crit {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 0;
        border-bottom: 0.5px solid var(--border);
      }
      .crit:last-child {
        border-bottom: none;
      }
      .stepper {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sbtn {
        width: 28px;
        height: 28px;
        border-radius: var(--radius-sm);
        background: var(--bg-hover);
        border: 0.5px solid var(--border-hover);
        color: var(--text-primary);
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: var(--transition);
      }
      .sbtn:hover {
        background: var(--bg-active);
        border-color: var(--brand);
      }
      .sval {
        font-family: var(--font-mono);
        font-size: 16px;
        font-weight: 600;
        width: 32px;
        text-align: center;
      }
      .ring {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        border: 3px solid var(--border-hover);
        transition: var(--transition);
        margin: 0 auto 12px;
      }
    </style>
  </head>
  <body>
    <div id="toast-container"></div>
    <div id="app"></div>
    <script src="../../js/core.js"></script>
    <script src="../../js/components/components.js"></script>
<script>
if(!Auth.guardPage('JUDGE'))throw new Error();

document.getElementById('app').innerHTML=`<div class="page-shell">
${buildTopnav('JUDGE','scoring.html')}
<div class="page-content">
  <div class="page-header"><div><div class="page-title">Scoring</div><div class="page-desc">Evaluate and score team submissions</div></div></div>
  <div style="background:var(--bg-surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <select id="hs" onchange="loadTeams(this.value)" style="min-width:180px;">
      <option value="">— Select Hackathon —</option>
      <option value="1">ML Bootcamp 2025</option>
      <option value="2">DSA Sprint</option>
    </select>
    <select id="ts" onchange="loadTeam(this.value)" style="min-width:180px;"><option value="">— Select team —</option></select>
    <div id="status-wrap" style="display:none;margin-left:auto;display:flex;gap:8px;align-items:center;">
      <span id="save-tag" style="font-size:10px;font-weight:600;background:rgba(245,158,11,0.12);color:#FCD34D;border:0.5px solid rgba(245,158,11,0.25);padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:0.5px;">Draft</span>
    </div>
  </div>
  <div id="empty-sc"><div class="empty-state" style="padding:80px;"><div class="empty-icon"><i class="ti ti-pencil-star"></i></div><div class="empty-title">Select a team to score</div><div class="empty-desc">Choose a hackathon and team above.</div></div></div>
  <div id="sc-form" style="display:none;">
    <div style="display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;">
      <div>
        <div class="card" style="margin-bottom:16px;">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:16px;border-bottom:0.5px solid var(--border);">
            <div style="width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#D946EF,#4F46E5);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;" id="t-init">—</div>
            <div style="flex:1;"><div style="font-family:var(--font-display);font-size:16px;font-weight:700;" id="t-name">—</div><div style="font-size:12px;color:var(--text-muted);" id="t-meta">—</div></div>
            <div style="display:flex;gap:8px;"><a href="#" id="t-gh" target="_blank" class="btn btn-secondary btn-sm"><i class="ti ti-brand-github"></i> GitHub</a><button class="btn btn-secondary btn-sm" onclick="Toast.show('Downloading…','info')"><i class="ti ti-download"></i> Files</button></div>
          </div>
          <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;">Scoring Criteria (0–10 each)</div>
          <div id="criteria"></div>
        </div>
        <div class="card">
          <div class="card-header" style="margin-bottom:12px;"><div><div class="card-title">Judge Feedback</div><div class="card-subtitle">Optional — visible to team after results announced</div></div></div>
          <textarea id="feedback" rows="5" placeholder="Write detailed feedback… mention strengths, areas for improvement, technical depth…"></textarea>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;text-align:right;" id="char-c">0/1000</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="card" style="text-align:center;">
          <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;">Total Score</div>
          <div class="ring" id="ring"><div style="font-family:var(--font-display);font-size:24px;font-weight:800;" id="rv">0</div><div style="font-size:10px;color:var(--text-muted);">/ 100</div></div>
          <div style="font-size:12px;" id="grade">Not started</div>
        </div>
        <div class="card"><div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">Breakdown</div><div id="breakdown"></div></div>
        <button class="btn btn-primary btn-full" style="padding:12px;font-size:14px;" id="sub-sc" onclick="submitScore()"><i class="ti ti-send"></i> Submit Score</button>
        <button class="btn btn-secondary btn-full" onclick="clearSc()"><i class="ti ti-refresh"></i> Reset</button>
        <div class="card"><div style="font-size:12px;font-weight:600;margin-bottom:10px;">Scoring Guide</div>
          ${[['9–10','Exceptional','var(--accent-success)'],['7–8','Good','#60A5FA'],['5–6','Average','var(--accent-warn)'],['3–4','Below avg','#F97316'],['0–2','Poor','var(--accent-danger)']].map(([r,l,c])=>`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;"><span style="color:var(--text-muted);">${r}</span><span style="color:${c};">${l}</span></div>`).join('')}
        </div>
      </div>
    </div>
  </div>
</div></div>${buildNotifPanel()}${buildUserDropdown()}`;

initNotifToggle([]);initAvatarDropdown();populateProfile();

const CR=[{id:'innovation',label:'Innovation & Creativity',desc:'How novel and creative is the solution?',w:20},{id:'technical',label:'Technical Execution',desc:'Code quality, architecture, complexity.',w:25},{id:'impact',label:'Real-World Impact',desc:'Does it solve a meaningful problem?',w:20},{id:'presentation',label:'Demo & Presentation',desc:'Clarity and quality of demo.',w:20},{id:'completeness',label:'Completeness',desc:'Is the project fully functional?',w:15}];

// Global state
let SUBSMISSIONS = [];
let SC={}, curT=null;

// --- REAL API INTEGRATION ---

async function loadTeams(hid) {
  if (!hid) {
    document.getElementById('ts').innerHTML = '<option value="">— Select team —</option>';
    document.getElementById('sc-form').style.display='none';
    document.getElementById('empty-sc').style.display='';
    return;
  }

  // GET real submissions for this hackathon
  const data = await api.get(`/judge/hackathon/${hid}/submissions`);
  
  if (!data) {
    SUBSMISSIONS = [];
  } else {
    // Map DTO to our frontend object
    SUBSMISSIONS = data.map(s => ({
      id: s.id, // This is the submissionId
      teamName: s.teamName || 'Unknown Team',
      title: s.title || 'Project Submission',
      gh: s.githubUrl || '#',
      desc: s.description || '',
      scoreValue: s.scoreValue || null // If backend provides existing scores
    }));
  }

  const s = document.getElementById('ts');
  s.innerHTML = '<option value="">— Select team —</option>' + SUBSMISSIONS.map(t => `<option value="${t.id}">${t.teamName} - ${t.title}${t.scoreValue ? ' ✓' : ''}</option>`).join('');
  
  document.getElementById('sc-form').style.display='none';
  document.getElementById('empty-sc').style.display='';
  SC={};
}

function loadTeam(subId){
  if(!subId){document.getElementById('sc-form').style.display='none';document.getElementById('empty-sc').style.display='';return;}
  
  curT = SUBSMISSIONS.find(t => t.id === parseInt(subId));
  if(!curT) return;
  
  SC = {}; 
  CR.forEach(c => SC[c.id] = 0);
  
  document.getElementById('t-init').textContent = fmt.initials(curT.teamName);
  document.getElementById('t-name').textContent = curT.teamName;
  document.getElementById('t-meta').textContent = curT.title;
  document.getElementById('t-gh').href = curT.gh;
  document.getElementById('feedback').value = '';
  
  document.getElementById('status-wrap').style.display='flex';
  document.getElementById('save-tag').textContent = curT.scoreValue ? 'Scored' : 'Pending';
  
  document.getElementById('sc-form').style.display='';
  document.getElementById('empty-sc').style.display='none';
  
  renderCr();
  updateTotal();
}

function renderCr(){
  document.getElementById('criteria').innerHTML = CR.map(c => `<div class="crit"><div style="flex:1;"><div style="font-size:13px;font-weight:500;">${c.label} <span style="font-size:11px;color:var(--text-muted);">(×${c.w/10})</span></div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${c.desc}</div></div><div class="stepper"><button class="sbtn" onclick="adj('${c.id}',-1)">−</button><div class="sval" id="sv-${c.id}">${SC[c.id]||0}</div><button class="sbtn" onclick="adj('${c.id}',1)">+</button></div></div>`).join('');
}

function adj(id,d){
  SC[id] = Math.min(10, Math.max(0, (SC[id]||0) + d));
  document.getElementById('sv-'+id).textContent = SC[id];
  updateTotal();
}

function updateTotal(){
  let t=0;
  CR.forEach(c => t += (SC[c.id]||0)*(c.w/10));
  t = Math.round(t); // Round to integer for standard total display
  
  document.getElementById('rv').textContent = t;
  
  const el=document.getElementById('ring'), gr=document.getElementById('grade');
  let col, gl;
  if(t>=85){col='var(--accent-success)';gl='🏆 Exceptional';}
  else if(t>=70){col='#60A5FA';gl='✅ Good';}
  else if(t>=55){col='var(--accent-warn)';gl='⚠️ Average';}
  else if(t>=40){col='#F97316';gl='📉 Below Avg';}
  else{col='var(--accent-danger)';gl='❌ Poor';}
  
  document.getElementById('rv').style.color=col;
  el.style.borderColor=col;
  gr.textContent=gl;
  gr.style.color=col;
  
  document.getElementById('breakdown').innerHTML=CR.map(c=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid var(--border);"><span style="font-size:12px;color:var(--text-secondary);">${c.label.split(' ')[0]}</span><div style="display:flex;align-items:center;gap:6px;"><div class="progress-bar" style="width:56px;height:4px;"><div class="progress-fill" style="width:${(SC[c.id]||0)*10}%;background:${col};"></div></div><span style="font-family:var(--font-mono);font-size:11px;min-width:16px;text-align:right;">${SC[c.id]||0}</span></div></div>`).join('');
}

function clearSc(){
  CR.forEach(c => SC[c.id] = 0);
  renderCr();
  updateTotal();
}

async function submitScore(){
  let total = 0;
  CR.forEach(c => total += (SC[c.id] || 0) * (c.w / 10));
  total = Math.round(total); // Round to integer as expected by backend ScoreRequest
  
  if(total === 0){ Toast.show('Please score at least one criterion.', 'warning'); return; }
  
  const btn = document.getElementById('sub-sc');
  setLoading(btn, true);
  
  // Create payload exact to backend ScoreRequest dto
  const payload = {
    submissionId: curT.id, 
    scoreValue: total,
    feedback: document.getElementById('feedback').value.trim()
  };
  
  const data = await api.post('/judge/score', payload);
  setLoading(btn, false);
  
  if (!data) return; // Errors handled by api helper
  
  const st = document.getElementById('save-tag');
  st.textContent = 'Submitted';
  st.style.background = 'rgba(34,197,94,0.12)';
  st.style.color = '#4ADE80';
  
  curT.scoreValue = total;
  
  // Update dropdown to show checkmark
  const option = document.querySelector(`#ts option[value="${curT.id}"]`);
  if(option && !option.textContent.includes('✓')) option.textContent += ' ✓';
  
  Toast.show(`Score of ${total} submitted for ${curT.teamName}!`, 'success', 'Score Submitted');
}

document.getElementById('feedback').addEventListener('input',function(){
  const l = this.value.length;
  document.getElementById('char-c').textContent=`${l}/1000`;
  if(l > 1000) this.value = this.value.slice(0, 1000);
});

// Load teams will only trigger when the judge selects a hackathon from the dropdown manually.
</script>
  </body>
</html>
