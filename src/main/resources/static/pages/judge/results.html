<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>EduEvent Judge — Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/global.css">
  <style>
    .podium-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:flex-end;margin-bottom:22px;}
    .pb{background:var(--bg-card);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:18px 14px;text-align:center;}
    .pb.p1{border-color:rgba(245,158,11,0.4);background:rgba(245,158,11,0.04);}
    .pb.p2{border-color:rgba(148,163,184,0.25);}
    .pb.p3{border-color:rgba(180,83,9,0.25);}
    .exp-inner{display:none;padding:14px 16px;border-top:0.5px solid var(--border);}
    .exp-inner.open{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
    tr.exp-row td{padding:0!important;background:var(--bg-surface)!important;}
  </style>
</head>
<body>
<div id="toast-container"></div><div id="app"></div>
<script src="../../js/core.js"></script>
<script src="../../js/components/components.js"></script>
<script>
if(!Auth.guardPage('JUDGE'))throw new Error();
document.getElementById('app').innerHTML=`<div class="page-shell">
${buildTopnav('JUDGE','results.html')}
<div class="page-content">
  <div class="page-header"><div><div class="page-title">Results</div><div class="page-desc">Final rankings based on all judges' scores</div></div></div>
  <div style="background:var(--bg-surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <select id="hs" onchange="loadR(this.value)" style="min-width:200px;"><option value="">— Select Event —</option></select>
    <span style="font-size:12px;color:var(--text-muted);" id="rm">—</span>
    <button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="exportCsv()"><i class="ti ti-download"></i> Export CSV</button>
  </div>
  <div id="warn" style="display:none;background:rgba(245,158,11,0.08);border:0.5px solid rgba(245,158,11,0.25);border-radius:var(--radius-lg);padding:11px 16px;margin-bottom:18px;font-size:13px;color:var(--text-secondary);"><i class="ti ti-alert-triangle" style="color:#E0A93B;margin-right:8px;"></i>Some teams not yet scored. Results may change.</div>
  <div class="podium-wrap" id="podium"></div>
  <div class="card" style="margin-bottom:20px;">
    <div class="card-header"><div><div class="card-title">Full Rankings</div><div class="card-subtitle">Final standings — published once the admin announces winners</div></div><div id="sc-badge"></div></div>
    <div class="table-wrapper"><table><thead><tr><th>Rank</th><th>Team</th><th>Members</th><th>Total Score</th><th>Result</th></tr></thead><tbody id="rtbl"></tbody></table></div>
  </div>
  <div class="card">
    <div class="card-header"><div><div class="card-title">My Scoring Summary</div><div class="card-subtitle">The scores you personally submitted for this event</div></div></div>
    <div id="ms"></div>
  </div>
</div></div>${buildNotifPanel()}${buildUserDropdown()}`;
initNotifToggle([]);initAvatarDropdown();populateProfile();
let curTeams = [], curName = 'results';

async function loadEvents(){
  const data = await api.get('/judge/my-hackathons');
  const list = Array.isArray(data) ? data : [];
  const hs = document.getElementById('hs');
  if(!list.length){ hs.innerHTML='<option value="">— No assigned events —</option>'; return; }
  hs.innerHTML='<option value="">— Select Event —</option>'+list.map(h=>`<option value="${h.id}">${h.title}</option>`).join('');
  hs.value = list[0].id;     // auto-select the first assigned event so results show immediately
  loadR(list[0].id);
}

async function loadR(id){
  const podium=document.getElementById('podium'), tbl=document.getElementById('rtbl'), ms=document.getElementById('ms');
  document.getElementById('warn').style.display='none';
  if(!id){ podium.innerHTML=''; tbl.innerHTML=''; ms.innerHTML=''; document.getElementById('rm').textContent=''; document.getElementById('sc-badge').innerHTML=''; curTeams=[]; return; }

  const results = await api.get(`/hackathon/${id}/results`);
  const teams = Array.isArray(results) ? results : [];
  curTeams = teams;
  curName = (document.getElementById('hs').selectedOptions[0]?.textContent || 'results').trim();
  document.getElementById('rm').textContent = teams.length ? `${teams.length} teams ranked` : '';
  document.getElementById('sc-badge').innerHTML = teams.length
    ? '<span class="badge badge-active"><i class="ti ti-check"></i> Published</span>'
    : '<span class="badge badge-pending">Not published</span>';
  renderPodium(teams);
  renderTable(teams);
  renderMy(id);
}

function renderPodium(teams){
  const top=teams.slice(0,3);
  const ord=[top[1],top[0],top[2]], cls=['pb p2','pb p1','pb p3'], med=['🥈','🥇','🥉'];
  document.getElementById('podium').innerHTML=ord.map((t,i)=>t?`<div class="${cls[i]}"><div style="font-size:30px;margin-bottom:8px;">${med[i]}</div><div style="font-family:var(--font-display);font-size:14px;font-weight:700;margin-bottom:4px;">${t.teamName}</div><div style="font-family:var(--font-mono);font-size:20px;font-weight:500;color:${i===1?'#E0A93B':i===0?'#9C8FC4':'#C77A45'};">${fmt.score(t.totalScore||0)}</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px;">${(t.memberNames||[]).length} members</div></div>`:'<div></div>').join('');
}

function renderTable(teams){
  const med=['🥇','🥈','🥉'];
  document.getElementById('rtbl').innerHTML = teams.length
    ? teams.map((t,i)=>{const rank=t.rank||i+1;return`<tr class="${rank<=3?'rank-'+rank:''}">
        <td style="font-size:${rank<=3?'16':'13'}px;font-weight:800;">${rank<=3?med[rank-1]:rank}</td>
        <td style="font-weight:600;">${t.teamName||'—'}</td>
        <td style="color:var(--text-muted);">${(t.memberNames||[]).join(', ')||'—'}</td>
        <td><span style="font-family:var(--font-display);font-size:15px;font-weight:800;color:${rank===1?'#E0A93B':rank===2?'#9C8FC4':rank===3?'#C77A45':'var(--text-primary)'};">${fmt.score(t.totalScore||0)}</span></td>
        <td>${t.certificatesIssued?'<span class="badge badge-active">Certified</span>':'<span class="badge badge-completed">Ranked</span>'}</td>
      </tr>`;}).join('')
    : `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted);">No results yet — the admin publishes results by announcing winners.</td></tr>`;
}

async function renderMy(id){
  const data = await api.get(`/judge/hackathon/${id}/my-scores`);
  const sc = Array.isArray(data) ? data : [];
  const ms = document.getElementById('ms');
  if(!sc.length){ ms.innerHTML='<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">You haven\'t scored any team in this event yet.</div>'; return; }
  const vals=sc.map(t=>t.scoreValue||0);
  const avg=vals.reduce((s,v)=>s+v,0)/vals.length;
  ms.innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;">
    <div style="background:var(--bg-hover);border-radius:var(--radius-md);padding:12px;text-align:center;"><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">Teams Scored</div><div style="font-family:var(--font-display);font-size:22px;font-weight:800;">${sc.length}</div></div>
    <div style="background:var(--bg-hover);border-radius:var(--radius-md);padding:12px;text-align:center;"><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">My Avg Score</div><div style="font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--brand-muted);">${fmt.score(avg)}</div></div>
    <div style="background:var(--bg-hover);border-radius:var(--radius-md);padding:12px;text-align:center;"><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">Range</div><div style="font-family:var(--font-display);font-size:18px;font-weight:800;">${fmt.score(Math.min(...vals))}–${fmt.score(Math.max(...vals))}</div></div></div>
  ${sc.sort((a,b)=>(b.scoreValue||0)-(a.scoreValue||0)).map(t=>`<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;"><span style="font-size:13px;font-weight:500;min-width:120px;">${t.teamName||'Team'}</span><div class="progress-bar" style="flex:1;"><div class="progress-fill" style="width:${t.scoreValue||0}%;background:linear-gradient(90deg,#00E5FF,#FF2E97);"></div></div><span style="font-family:var(--font-mono);font-size:13px;font-weight:600;min-width:36px;text-align:right;">${fmt.score(t.scoreValue||0)}</span></div>`).join('')}`;
}

function exportCsv(){
  if(!curTeams.length){ Toast.show('No published results to export yet.','warning'); return; }
  const rows=[['Rank','Team','Members','Total Score','Result']];
  curTeams.forEach((t,i)=>rows.push([t.rank||i+1, t.teamName||'', (t.memberNames||[]).join('; '), t.totalScore||0, t.certificatesIssued?'Certified':'Ranked']));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=curName.replace(/[^\w]+/g,'_')+'_results.csv';
  a.click(); URL.revokeObjectURL(a.href);
  Toast.show('Results exported.','success');
}

document.addEventListener('DOMContentLoaded', loadEvents);
</script>
</body>
</html>
