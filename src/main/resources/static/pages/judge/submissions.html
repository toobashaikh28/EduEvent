<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>EduEvent Judge — Submissions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../../css/global.css" />
    <style>
      .acc {
        background: var(--bg-card);
        border: 0.5px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        margin-bottom: 10px;
        transition: var(--transition);
      }
      .acc:hover {
        border-color: var(--border-hover);
      }
      .acc.exp {
        border-color: rgba(217, 70, 239, 0.3);
      }
      .acc-hdr {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px 18px;
        cursor: pointer;
        transition: var(--transition);
      }
      .acc-hdr:hover {
        background: var(--bg-hover);
      }
      .acc-body {
        display: none;
        padding: 0 18px 18px;
        border-top: 0.5px solid var(--border);
      }
      .acc-body.open {
        display: block;
      }
      .tech-chip {
        display: inline-flex;
        padding: 2px 8px;
        background: rgba(79, 70, 229, 0.1);
        border: 0.5px solid rgba(79, 70, 229, 0.2);
        border-radius: 99px;
        font-size: 11px;
        color: var(--brand-muted);
        margin: 2px;
      }
    </style>
  </head>
  <body>
    <div id="toast-container"></div>
    <div id="app"></div>
    <script src="../../js/core.js"></script>
    <script src="../../js/components/components.js"></script>
    <script>
      if (!Auth.guardPage("JUDGE")) throw new Error();

      document.getElementById("app").innerHTML = `<div class="page-shell">
${buildTopnav("JUDGE", "submissions.html")}
<div class="page-content">
  <div class="page-header"><div><div class="page-title">Submissions</div><div class="page-desc">Project submissions from your assigned hackathons</div></div></div>
  <div style="background:var(--bg-surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <select id="hf"><option value="">All Hackathons</option></select>
    <select id="sf"><option value="">All Statuses</option><option value="pending">Pending Score</option><option value="scored">Scored</option></select>
    <div class="search-wrap" style="flex:1;min-width:160px;max-width:260px;"><i class="ti ti-search"></i><input type="text" id="sq" placeholder="Search team…"></div>
    <span style="font-size:12px;color:var(--text-muted);margin-left:auto;" id="sc">— submissions</span>
  </div>
  <div id="slist"></div>
</div></div>${buildNotifPanel()}${buildUserDropdown()}`;

      initNotifToggle([]);
      initAvatarDropdown();
      populateProfile();

      // Global State
      let SUBS = [];
      let exp = null;

      // --- REAL API INTEGRATION ---

      async function loadData() {
        // First, fetch all events so we can populate the dropdown and match names to IDs
        const eventsData = await api.get("/events").catch(() => []);
        const hackathons = eventsData.filter(
          (e) => e.type?.toLowerCase() === "hackathon",
        );

        // Populate the dropdown
        const hf = document.getElementById("hf");
        hf.innerHTML =
          '<option value="">All Hackathons</option>' +
          hackathons
            .map((h) => `<option value="${h.id}">${h.title}</option>`)
            .join("");

        // Next, fetch submissions for EVERY hackathon (since the endpoint requires an ID)
        // In a real production app, you might want a dedicated endpoint like /api/judge/my-submissions
        let allSubmissions = [];

        for (const hack of hackathons) {
          const subsForHack = await api
            .get(`/judge/hackathon/${hack.id}/submissions`)
            .catch(() => null);
          if (subsForHack && subsForHack.length > 0) {
            // Add the hackathon name to the DTO for display
            const mappedSubs = subsForHack.map((s) => ({
              id: s.id, // submissionId
              hackId: hack.id,
              hack: hack.title,
              team: s.teamName || "Unknown Team",
              title: s.title || "Project Submission",
              members: s.members
                ? s.members.map(
                    (m) => m.name || m.participantName || m.userName,
                  )
                : ["Team Member"],
              date: s.submittedAt || s.createdAt || new Date().toISOString(), // Use backend date if available
              status: s.scoreValue !== null ? "scored" : "pending",
              score: s.scoreValue, // The total score the judge previously gave
              github: s.githubUrl || "#",
              desc: s.description || "No description provided.",
              tech: [], // If your backend ever adds a tech tags field, map it here
              size: "12 MB", // Mock file size (backend usually provides a download link, not size)
            }));
            allSubmissions = allSubmissions.concat(mappedSubs);
          }
        }

        SUBS = allSubmissions;
        applyF();
      }

      function applyF() {
        const h = document.getElementById("hf").value;
        const s = document.getElementById("sf").value;
        const q = document.getElementById("sq").value.toLowerCase();

        const f = SUBS.filter(
          (x) =>
            (!h || x.hackId === parseInt(h)) &&
            (!s || x.status === s) &&
            (!q || x.team.toLowerCase().includes(q)),
        );

        document.getElementById("sc").textContent =
          `${f.length} submission${f.length !== 1 ? "s" : ""}`;

        document.getElementById("slist").innerHTML =
          f
            .map((sub) => {
              const open = exp === sub.id;
              return `<div class="acc ${open ? "exp" : ""}">
      <div class="acc-hdr" onclick="toggle(${sub.id})">
        <div style="width:38px;height:38px;border-radius:50%;background:${sub.status === "scored" ? "rgba(34,197,94,0.15)" : "rgba(217,70,239,0.15)"};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:${sub.status === "scored" ? "#4ADE80" : "#E879F9"};flex-shrink:0;">${fmt.initials(sub.team)}</div>
        <div style="flex:1;min-width:0;"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-size:14px;font-weight:600;">${sub.team}</span><span class="badge badge-hackathon" style="font-size:10px;">${sub.hack}</span></div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${sub.members.join(" · ")} · Submitted ${fmt.date(sub.date)}</div></div>
        <div style="text-align:right;margin-right:10px;flex-shrink:0;">${sub.score !== null ? `<div style="font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--accent-success);">${fmt.score(sub.score)}</div><div style="font-size:10px;color:var(--text-muted);">Scored</div>` : '<span class="badge badge-pending">Pending</span>'}</div>
        <i class="ti ti-chevron-${open ? "up" : "down"}" style="color:var(--text-muted);font-size:13px;flex-shrink:0;"></i>
      </div>
      <div class="acc-body ${open ? "open" : ""}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-top:14px;">
          <div>
            <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Project Details</div>
            <div style="font-weight:600;margin-bottom:4px;font-size:14px;">${sub.title}</div>
            <div style="font-size:13px;color:var(--text-secondary);line-height:1.7;margin-bottom:12px;">${sub.desc}</div>
            <div style="margin-bottom:12px;"><div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">Team Members</div>${sub.members.map((m) => `<span style="display:inline-flex;align-items:center;gap:5px;padding:3px 9px;background:var(--bg-hover);border-radius:99px;font-size:12px;margin:2px;"><i class="ti ti-user" style="font-size:11px;color:var(--text-muted);"></i>${m}</span>`).join("")}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;"><a href="${sub.github}" target="_blank" class="btn btn-secondary btn-sm"><i class="ti ti-brand-github"></i> GitHub</a><button class="btn btn-secondary btn-sm" onclick="dlFiles(${sub.id})"><i class="ti ti-download"></i> Download Artifacts</button></div>
          </div>
          <div style="background:var(--bg-hover);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;justify-content:center;">
            ${
              sub.score !== null
                ? `<div style="text-align:center;margin-bottom:14px;"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Your Score</div><div style="font-family:var(--font-display);font-size:36px;font-weight:800;color:var(--accent-success);">${fmt.score(sub.score)}</div><div style="font-size:11px;color:var(--text-muted);">out of 100</div></div><a href="scoring.html?subId=${sub.id}" class="btn btn-secondary btn-sm" style="width:100%;justify-content:center;"><i class="ti ti-edit"></i> Edit Score</a>`
                : `<div style="text-align:center;margin-bottom:12px;"><div style="font-size:13px;font-weight:600;margin-bottom:8px;">Ready to score?</div><div style="font-size:12px;color:var(--text-muted);line-height:1.5;">Review the submission before scoring.</div></div><a href="scoring.html?subId=${sub.id}" class="btn btn-primary btn-sm" style="width:100%;justify-content:center;"><i class="ti ti-pencil-star"></i> Score This Submission</a>`
            }
          </div>
        </div>
      </div>
    </div>`;
            })
            .join("") ||
          '<div class="empty-state" style="padding:60px;"><div class="empty-icon"><i class="ti ti-file-off"></i></div><div class="empty-title">No submissions found</div></div>';
      }

      function toggle(id) {
        exp = exp === id ? null : id;
        applyF();
      }

      async function dlFiles(id) {
        const s = SUBS.find((x) => x.id === id);
        Toast.show(`Downloading artifacts for ${s.team}…`, "info");

        // Real implementation would hit an endpoint like: /api/judge/submission/{id}/download
        await new Promise((r) => setTimeout(r, 800));
        Toast.show("Downloaded successfully.", "success");
      }

      ["hf", "sf"].forEach((id) =>
        document.getElementById(id).addEventListener("change", applyF),
      );
      document.getElementById("sq").addEventListener("input", applyF);

      document.addEventListener("DOMContentLoaded", () => {
        loadData();
      });
    </script>
  </body>
</html>
