<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>EduEvent Judge — My Hackathons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/global.css">
  <style>
    .hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
    .hcard{background:var(--bg-card);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;cursor:pointer;transition:var(--transition);position:relative;overflow:hidden;}
    .hcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#D946EF,#4F46E5);}
    .hcard:hover{border-color:rgba(217,70,239,0.3);}
    .hcard.sel{border-color:rgba(217,70,239,0.5);background:rgba(217,70,239,0.04);}
  </style>
</head>
<body>
<div id="toast-container"></div><div id="app"></div>
<script src="../../js/core.js"></script>
<script src="../../js/components/components.js"></script>
<script>
if(!Auth.guardPage('JUDGE'))throw new Error();
document.getElementById('app').innerHTML=`<div class="page-shell">
${buildTopnav('JUDGE','hackathons.html')}
<div class="page-content">
  <div class="page-header"><div><div class="page-title">My Hackathons</div><div class="page-desc">Hackathon events assigned to you as judge</div></div></div>
  <div style="background:rgba(217,70,239,0.06);border:0.5px solid rgba(217,70,239,0.2);border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start;">
    <i class="ti ti-shield-lock" style="color:#E879F9;font-size:16px;flex-shrink:0;margin-top:2px;"></i>
    <div style="font-size:12px;color:var(--text-secondary);">You can only view and score submissions from hackathons you have been officially assigned to. Contact an admin if there is an assignment error.</div>
  </div>
  <div class="hg" id="hg"></div>
  <div id="hdetail" style="display:none;margin-top:22px;">
    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:10px;">
        <div><div class="card-title" id="d-name">—</div><div class="card-subtitle" id="d-meta">—</div></div>
        <div style="display:flex;gap:8px;"><a href="submissions.html" class="btn btn-secondary btn-sm"><i class="ti ti-files"></i> Submissions</a><a href="scoring.html" class="btn btn-primary btn-sm"><i class="ti ti-pencil-star"></i> Score</a></div>
      </div>
      <div style="margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;"><span style="font-size:13px;font-weight:500;">Scoring Progress</span><span style="font-size:12px;color:var(--text-muted);" id="d-prog-lbl">—</span></div>
        <div class="progress-bar" style="height:8px;"><div class="progress-fill" id="d-prog" style="background:linear-gradient(90deg,#D946EF,#4F46E5);"></div></div>
      </div>
      <div class="table-wrapper"><table><thead><tr><th>Team</th><th>Members</th><th>Submitted</th><th>My Score</th><th>Status</th><th></th></tr></thead><tbody id="d-body"></tbody></table></div>
    </div>
  </div>
</div></div>${buildNotifPanel()}${buildUserDropdown()}`;
initNotifToggle([]);initAvatarDropdown();populateProfile();
const HACKS=[{id:1,name:'ML Bootcamp 2025',status:'active',start:'2025-07-10',end:'2025-07-14',teams:7,scored:3,deadline:'2025-07-15'},{id:2,name:'DSA Sprint',status:'completed',start:'2025-07-05',end:'2025-07-07',teams:4,scored:4,deadline:'2025-07-08'}];
const TEAMS={1:[{name:'Neural Ninjas',members:3,sub:true,score:87.3,status:'scored'},{name:'ByteBusters',members:2,sub:true,score:null,status:'pending'},{name:'DataDrifters',members:4,sub:false,score:null,status:'not_submitted'},{name:'PixelPirates',members:2,sub:true,score:null,status:'pending'},{name:'CodeCraft',members:3,sub:true,score:null,status:'pending'},{name:'CloudNine',members:2,sub:true,score:76.0,status:'scored'},{name:'AlphaStack',members:3,sub:true,score:82.5,status:'scored'}],2:[{name:'AlgoAces',members:2,sub:true,score:91.0,status:'scored'},{name:'HackHeroes',members:3,sub:true,score:76.5,status:'scored'},{name:'ByteForce',members:2,sub:true,score:68.0,status:'scored'},{name:'DevDragons',members:2,sub:true,score:83.0,status:'scored'}]};
let selId=null;
function renderCards(){
  document.getElementById('hg').innerHTML=HACKS.map(h=>{const p=Math.round(h.scored/h.teams*100);return`<div class="hcard ${selId===h.id?'sel':''}" onclick="selHack(${h.id})">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;"><div><div style="font-family:var(--font-display);font-size:15px;font-weight:700;margin-bottom:3px;">${h.name}</div><div style="font-size:11px;color:var(--text-muted);">${fmt.date(h.start)} – ${fmt.date(h.end)}</div></div><span class="badge badge-${h.status==='active'?'active':'completed'}">${h.status}</span></div>
    <div style="display:flex;gap:20px;margin-bottom:12px;"><div><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Teams</div><div style="font-family:var(--font-display);font-size:18px;font-weight:700;">${h.teams}</div></div><div><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Scored</div><div style="font-family:var(--font-display);font-size:18px;font-weight:700;color:${h.scored===h.teams?'var(--accent-success)':'#E879F9'};">${h.scored}</div></div><div><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Deadline</div><div style="font-size:12px;font-weight:500;margin-top:4px;">${fmt.date(h.deadline)}</div></div></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${p}%;background:${h.scored===h.teams?'var(--accent-success)':'linear-gradient(90deg,#D946EF,#4F46E5)'};"></div></div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:5px;">${p}% scoring complete</div>
  </div>`;}).join('');
}
function selHack(id){selId=id;renderCards();const h=HACKS.find(x=>x.id===id),teams=TEAMS[id]||[];const sc=teams.filter(t=>t.status==='scored').length;
  document.getElementById('d-name').textContent=h.name;document.getElementById('d-meta').textContent=`${teams.length} teams · Deadline ${fmt.date(h.deadline)}`;
  document.getElementById('d-prog-lbl').textContent=`${sc} / ${teams.length} scored`;document.getElementById('d-prog').style.width=`${Math.round(sc/teams.length*100)}%`;
  document.getElementById('d-body').innerHTML=teams.map(t=>`<tr>
    <td>${t.name}</td><td>${t.members}</td>
    <td><span class="badge badge-${t.sub?'active':'pending'}">${t.sub?'Yes':'No'}</span></td>
    <td>${t.score!==null?`<span style="font-family:var(--font-mono);font-weight:600;color:var(--accent-success);">${fmt.score(t.score)}</span>`:'<span style="color:var(--text-muted);">—</span>'}</td>
    <td><span class="badge badge-${t.status==='scored'?'active':t.status==='pending'?'upcoming':'completed'}">${t.status.replace('_',' ')}</span></td>
    <td>${t.sub?`<a href="scoring.html" class="btn btn-primary btn-sm"><i class="ti ti-pencil-star"></i> ${t.score?'Edit':'Score'}</a>`:'<span style="font-size:11px;color:var(--text-muted);">Not submitted</span>'}</td>
  </tr>`).join('');
  document.getElementById('hdetail').style.display='';document.getElementById('hdetail').scrollIntoView({behavior:'smooth',block:'start'});}
document.addEventListener('DOMContentLoaded',renderCards);
</script>
</body>
</html>
