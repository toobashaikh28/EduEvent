<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>EduEvent Judge — My Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/global.css">
  <style>
    .hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
    .hcard{background:var(--bg-card);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;cursor:pointer;transition:var(--transition);position:relative;overflow:hidden;}
    .hcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#C5A9E8,#7C6FCD);}
    .hcard:hover{border-color:rgba(217,70,239,0.3);}
    .hcard.sel{border-color:rgba(217,70,239,0.5);background:rgba(217,70,239,0.04);}
  </style>
</head>
<body>
<div id="toast-container"></div><div id="app"></div>
<script src="../../js/core.js"></script>
<script src="../../js/components/components.js"></script>
<script>
if(!Auth.guardPage('JUDGE'))throw new Error();
document.getElementById('app').innerHTML=`<div class="page-shell">
${buildTopnav('JUDGE','hackathons.html')}
<div class="page-content">
  <div class="page-header"><div><div class="page-title">My Events</div><div class="page-desc">Events assigned to you as judge</div></div></div>
  <div style="background:rgba(217,70,239,0.06);border:0.5px solid rgba(217,70,239,0.2);border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start;">
    <i class="ti ti-shield-lock" style="color:#C5A9E8;font-size:16px;flex-shrink:0;margin-top:2px;"></i>
    <div style="font-size:12px;color:var(--text-secondary);">You can only view and score submissions from events you have been officially assigned to. Contact an admin if there is an assignment error.</div>
  </div>
  <div class="hg" id="hg"></div>
  <div id="hdetail" style="display:none;margin-top:22px;">
    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:10px;">
        <div><div class="card-title" id="d-name">—</div><div class="card-subtitle" id="d-meta">—</div></div>
        <div style="display:flex;gap:8px;"><a href="submissions.html" class="btn btn-secondary btn-sm"><i class="ti ti-files"></i> Submissions</a><a href="scoring.html" class="btn btn-primary btn-sm"><i class="ti ti-pencil-star"></i> Score</a></div>
      </div>
      <div style="margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;"><span style="font-size:13px;font-weight:500;">Scoring Progress</span><span style="font-size:12px;color:var(--text-muted);" id="d-prog-lbl">—</span></div>
        <div class="progress-bar" style="height:8px;"><div class="progress-fill" id="d-prog" style="background:linear-gradient(90deg,#C5A9E8,#7C6FCD);"></div></div>
      </div>
      <div class="table-wrapper"><table><thead><tr><th>Team</th><th>Project</th><th>Submitted</th><th>My Score</th><th>Action</th></tr></thead><tbody id="d-body"></tbody></table></div>
    </div>
  </div>
</div></div>${buildNotifPanel()}${buildUserDropdown()}`;
initNotifToggle([]);initAvatarDropdown();populateProfile();
let EVENTS=[]; let selId=null;

function renderCards(){
  const hg=document.getElementById('hg');
  if(!EVENTS.length){
    hg.innerHTML='<div class="empty-state"><div class="empty-icon"><i class="ti ti-calendar-off"></i></div><div class="empty-title">No assigned events</div><div class="empty-desc">An admin assigns you to events to judge.</div></div>';
    return;
  }
  hg.innerHTML=EVENTS.map(h=>{const st=(h.status||'').toLowerCase();return`<div class="hcard ${selId===h.id?'sel':''}" onclick="selEvent('${h.id}')">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;"><div><div style="font-family:var(--font-display);font-size:15px;font-weight:700;margin-bottom:3px;">${h.title}</div><div style="font-size:11px;color:var(--text-muted);">${h.startTime?fmt.date(h.startTime):'TBD'}${h.endTime?' – '+fmt.date(h.endTime):''}</div></div><span class="badge badge-${st==='active'||st==='live'?'active':st==='completed'?'completed':'upcoming'}">${st||'—'}</span></div>
    <div style="font-size:12px;color:var(--text-muted);"><i class="ti ti-click" style="margin-right:4px;"></i>Click to view submissions &amp; score</div>
  </div>`;}).join('');
}

async function loadEvents(){
  const d=await api.get('/judge/my-hackathons');
  EVENTS=Array.isArray(d)?d:[];
  renderCards();
}

async function selEvent(id){
  selId=id; renderCards();
  const ev=EVENTS.find(e=>e.id===id);
  const [subs,myscores]=await Promise.all([
    api.get(`/judge/hackathon/${id}/submissions`),
    api.get(`/judge/hackathon/${id}/my-scores`)
  ]);
  const submissions=Array.isArray(subs)?subs:[];
  const scores=Array.isArray(myscores)?myscores:[];
  const scoreBySub={}; scores.forEach(s=>{scoreBySub[s.submissionId]=s.scoreValue;});
  const scored=submissions.filter(s=>scoreBySub[s.id]!=null).length;

  document.getElementById('d-name').textContent=ev?ev.title:'Event';
  document.getElementById('d-meta').textContent=`${submissions.length} submission${submissions.length===1?'':'s'} · ${scored} scored by you`;
  const pct=submissions.length?Math.round(scored/submissions.length*100):0;
  document.getElementById('d-prog-lbl').textContent=`${scored} / ${submissions.length} scored`;
  document.getElementById('d-prog').style.width=pct+'%';

  document.getElementById('d-body').innerHTML=submissions.length
    ? submissions.map(s=>{const sc=scoreBySub[s.id];return`<tr>
        <td style="font-weight:500;">${s.teamName||'Team'}</td>
        <td>${s.title||'Project'}</td>
        <td>${s.submittedAt?fmt.date(s.submittedAt):'—'}</td>
        <td>${sc!=null?`<span style="font-family:var(--font-mono);font-weight:600;color:var(--accent-success);">${fmt.score(sc)}</span>`:'<span style="color:var(--text-muted);">—</span>'}</td>
        <td><a href="scoring.html" class="btn btn-primary btn-sm"><i class="ti ti-pencil-star"></i> ${sc!=null?'View':'Score'}</a></td>
      </tr>`;}).join('')
    : `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted);">No submissions yet for this event.</td></tr>`;

  document.getElementById('hdetail').style.display='';
  document.getElementById('hdetail').scrollIntoView({behavior:'smooth',block:'start'});
}

document.addEventListener('DOMContentLoaded',loadEvents);
</script>
</body>
</html>
