<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>EduEvent Judge — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/global.css">
  <style>.d2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}@media(max-width:768px){.d2{grid-template-columns:1fr;}}</style>
</head>
<body>
<div id="toast-container"></div><div id="app"></div>
<script src="../../js/core.js"></script>
<script src="../../js/components/components.js"></script>
<script>
if(!Auth.guardPage('JUDGE'))throw new Error();
document.getElementById('app').innerHTML=`<div class="page-shell">
${buildTopnav('JUDGE','dashboard.html')}
<div class="page-content">
  <div style="background:linear-gradient(135deg,rgba(46,107,255,0.16),rgba(56,189,248,0.07));border:1px solid rgba(59,130,246,0.26);border-radius:var(--radius-xl);padding:22px 28px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;">
    <div><div style="font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-0.5px;" id="wh">Welcome, Judge ⚖️</div><div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">You have pending submissions to review. Stay focused.</div></div>
    <button class="btn btn-primary" onclick="window.location.href='submissions.html'"><i class="ti ti-files"></i> Review Submissions</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;" id="s-row"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div>
  <div class="d2" style="margin-bottom:20px;">
    <div class="card"><div class="card-header"><div><div class="card-title">My Assigned Events</div><div class="card-subtitle">Events you are judging</div></div><a href="hackathons.html" class="btn btn-secondary btn-sm">View all</a></div><div id="ah-list"></div></div>
    <div class="card"><div class="card-header"><div><div class="card-title">Pending Reviews</div><div class="card-subtitle">Submissions awaiting score</div></div><a href="submissions.html" class="btn btn-secondary btn-sm">View all</a></div><div id="pr-list"></div></div>
  </div>
  <div class="card">
    <div class="card-header"><div><div class="card-title">Recent Scoring Activity</div><div class="card-subtitle">Your last scored submissions</div></div></div>
    <div class="table-wrapper"><table><thead><tr><th>Team</th><th>Event</th><th>Score Given</th><th>Scored At</th><th></th></tr></thead><tbody id="sa-body"></tbody></table></div>
  </div>
</div></div>${buildNotifPanel()}${buildUserDropdown()}`;
initNotifToggle([]);initAvatarDropdown();populateProfile();

async function load(){
  const u=Auth.getUser();if(u)document.getElementById('wh').textContent=`Welcome, ${u.name?.split(' ')[0]||'Judge'} ⚖️`;

  const events=(await api.get('/judge/my-hackathons'))||[];
  const perEvent=[]; const allPending=[]; const allScores=[];

  for(const e of events){
    const [subs,scores]=await Promise.all([
      api.get(`/judge/hackathon/${e.id}/submissions`),
      api.get(`/judge/hackathon/${e.id}/my-scores`)
    ]);
    const s=Array.isArray(subs)?subs:[], sc=Array.isArray(scores)?scores:[];
    const scoredIds=new Set(sc.map(x=>x.submissionId));
    s.filter(x=>!scoredIds.has(x.id)).forEach(x=>allPending.push({team:x.teamName||'Team',event:e.title}));
    sc.forEach(x=>allScores.push({team:x.teamName||'Team',event:e.title,score:x.scoreValue||0,at:x.scoredAt}));
    perEvent.push({title:e.title,status:(e.status||'').toLowerCase(),pending:s.filter(x=>!scoredIds.has(x.id)).length});
  }

  const totalScored=allScores.length, totalPending=allPending.length;
  document.getElementById('s-row').innerHTML=`
    <div class="stat-card c-brand"><div class="stat-label">Assigned Events</div><div class="stat-value">${events.length}</div><div class="stat-delta up"><i class="ti ti-calendar-check"></i> Active judge</div></div>
    <div class="stat-card c-amber"><div class="stat-label">Submissions to Review</div><div class="stat-value">${totalPending}</div><div class="stat-delta"><i class="ti ti-clock"></i> Awaiting score</div></div>
    <div class="stat-card c-green"><div class="stat-label">Scored So Far</div><div class="stat-value">${totalScored}</div><div class="stat-delta up"><i class="ti ti-check"></i> Completed</div></div>
    <div class="stat-card c-teal"><div class="stat-label">Events Judging</div><div class="stat-value">${events.length}</div><div class="stat-delta"><i class="ti ti-gavel"></i> Assigned</div></div>`;

  document.getElementById('ah-list').innerHTML=perEvent.length
    ? perEvent.map(h=>`<div class="list-row lr-cyan">
        <div class="lr-icon"><i class="ti ti-calendar-event"></i></div>
        <div class="lr-main"><div class="lr-label">${h.title}</div><div class="lr-sub" style="text-transform:capitalize;">${h.status||'—'}</div></div>
        ${h.pending>0?`<span class="pill pill-warn">${h.pending} pending</span>`:'<span class="pill pill-secure"><i class="ti ti-check"></i> All scored</span>'}
      </div>`).join('')
    : '<div style="padding:18px 0;text-align:center;color:var(--text-muted);font-size:13px;">No events assigned yet.</div>';

  document.getElementById('pr-list').innerHTML=allPending.length
    ? allPending.slice(0,6).map(s=>`<div class="list-row lr-blue">
        <div class="lr-icon" style="border-radius:50%;">${fmt.initials(s.team)}</div>
        <div class="lr-main"><div class="lr-label">${s.team}</div><div class="lr-sub">${s.event}</div></div>
        <a href="scoring.html" class="btn btn-primary btn-sm"><i class="ti ti-pencil-star"></i> Score</a>
      </div>`).join('')
    : '<div style="padding:18px 0;text-align:center;color:var(--text-muted);font-size:13px;">Nothing pending — you\'re all caught up.</div>';

  allScores.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  document.getElementById('sa-body').innerHTML=allScores.length
    ? allScores.slice(0,10).map(s=>`<tr><td>${s.team}</td><td style="color:var(--text-muted);">${s.event}</td><td><span style="font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--accent-success);">${fmt.score(s.score)}</span></td><td style="color:var(--text-muted);font-size:12px;">${s.at?fmt.datetime(s.at):'—'}</td><td><a href="scoring.html" class="btn btn-secondary btn-sm"><i class="ti ti-edit"></i> View</a></td></tr>`).join('')
    : '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-muted);">No scoring activity yet.</td></tr>';
}
document.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
