<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>EduEvent Admin — Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/global.css">
  
</head>
<body>
<div id="toast-container"></div><div id="app"></div>
<script src="../../js/core.js"></script>
<script src="../../js/components/components.js"></script>
<script>
if(!Auth.guardPage('ADMIN'))throw new Error();
document.getElementById('app').innerHTML=`<div class="admin-shell">
${buildAdminSidebar('events.html')}
${buildAdminTopbar('Events')}
<main class="main-content">
<div class="page-header">
  <div><div class="page-title">Manage Events</div><div class="page-desc">Create and manage all platform events</div></div>
  <button class="btn btn-primary" onclick="openCreate()"><i class="ti ti-plus"></i> Create Event</button>
</div>
<div class="card">
  <div class="card-header" style="flex-wrap:wrap;gap:12px;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;flex:1;">
      <div class="search-wrap" style="min-width:200px;max-width:280px;"><i class="ti ti-search"></i><input type="text" placeholder="Search events…" id="sq" oninput="applyF()"></div>
      <select id="ft" onchange="applyF()"><option value="">All Types</option><option value="hackathon">Hackathon</option><option value="webinar">Webinar</option><option value="conference">Conference</option><option value="quiz">Quiz</option></select>
      <select id="fs" onchange="applyF()"><option value="">All Statuses</option><option value="active">Active</option><option value="upcoming">Upcoming</option><option value="completed">Completed</option></select>
    </div>
    <span style="font-size:12px;color:var(--text-muted);" id="ec"></span>
  </div>
  <div class="table-wrapper"><table id="etbl"><thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Date</th><th>Registrations</th><th>Organizer</th><th>Actions</th></tr></thead><tbody id="etbody"></tbody></table></div>
</div>
</main></div>
${buildNotifPanel()}${buildUserDropdown()}
<div class="modal-overlay" id="emod">
  <div class="modal" style="max-width:540px;">
    <div class="modal-header"><div class="modal-title" id="emod-t">Create Event</div><button class="icon-btn" onclick="document.getElementById('emod').classList.remove('open')"><i class="ti ti-x"></i></button></div>
    <div class="form-grid">
      <div class="form-group full"><label class="form-label">Event Title</label><input type="text" id="ft-title" placeholder="e.g. ML Bootcamp 2025"></div>
      <div class="form-group"><label class="form-label">Type</label><select id="ft-type"><option value="hackathon">Hackathon</option><option value="webinar">Webinar</option><option value="conference">Conference</option><option value="quiz">Quiz</option></select></div>
      <div class="form-group"><label class="form-label">Status</label><select id="ft-status"><option value="upcoming">Upcoming</option><option value="active">Active</option><option value="completed">Completed</option></select></div>
      <div class="form-group"><label class="form-label">Start Date</label><input type="date" id="ft-start"></div>
      <div class="form-group"><label class="form-label">End Date</label><input type="date" id="ft-end"></div>
      <div class="form-group"><label class="form-label">Max Capacity</label><input type="number" id="ft-max" value="200"></div>
      <div class="form-group"><label class="form-label">Join Link (Optional)</label><input type="url" id="ft-link" placeholder="https://zoom.us/j/..."></div>
      <div class="form-group full"><label class="form-label">Description</label><textarea id="ft-desc" rows="3"></textarea></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;">
      <button class="btn btn-secondary" onclick="document.getElementById('emod').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" id="esave" onclick="saveEv()"><i class="ti ti-check"></i> Save</button>
    </div>
  </div>
</div>`;

initNotifToggle([]);initAvatarDropdown();populateProfile();

// Global array to hold the real events from the backend
let EV = [];
let eid = null;

// --- REAL API INTEGRATION ---

async function loadData() {
  const data = await api.get('/events');
  if(!data) {
    EV = [];
    rEv(EV);
    return;
  }
  
  // Map the Spring Boot DTO to our frontend object structure
  EV = data.map(e => ({
    id: e.id,
    name: e.title,
    type: e.type?.toLowerCase() || 'event',
    status: e.status?.toLowerCase() || 'upcoming',
    startDate: e.startTime ? e.startTime.split('T')[0] : '', // Extract just the YYYY-MM-DD date part
    endDate: e.endTime ? e.endTime.split('T')[0] : '',
    registrations: e.registeredCount || 0,
    maxReg: e.capacity || 100,
    organizer: e.createdBy || 'Admin',
    desc: e.description || '',
    link: e.joinLink || ''
  }));
  
  applyF();
}

function rEv(list) {
  document.getElementById('ec').textContent = list.length + ' events';
  document.getElementById('etbody').innerHTML = list.map(e => `<tr>
    <td>${e.name}</td>
    <td><span class="badge badge-${e.type}">${e.type}</span></td>
    <td><span class="badge badge-${e.status}">${e.status}</span></td>
    <td>${e.startDate ? fmt.date(e.startDate) : 'TBD'}</td>
    <td>
      <div style="display:flex;align-items:center;gap:8px;">
        ${e.registrations}/${e.maxReg}
        <div class="progress-bar" style="width:50px;">
          <div class="progress-fill" style="width:${Math.min(100, Math.round(e.registrations/e.maxReg*100) || 0)}%;background:var(--brand);"></div>
        </div>
      </div>
    </td>
    <td>${e.organizer}</td>
    <td>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-secondary btn-sm" onclick="oEdit(${e.id})"><i class="ti ti-edit"></i></button>
        <button class="btn btn-danger btn-sm" onclick="dEv(${e.id})"><i class="ti ti-trash"></i></button>
      </div>
    </td>
  </tr>`).join('') || '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon"><i class="ti ti-calendar-off"></i></div><div class="empty-title">No events found</div></div></td></tr>';
}

function applyF() {
  const t = document.getElementById('ft').value;
  const s = document.getElementById('fs').value;
  const q = document.getElementById('sq') ? document.getElementById('sq').value.toLowerCase() : '';
  
  const filtered = EV.filter(e => 
    (!t || e.type === t) && 
    (!s || e.status === s) &&
    (!q || e.name.toLowerCase().includes(q))
  );
  rEv(filtered);
}

function openCreate() {
  eid = null;
  document.getElementById('emod-t').textContent = 'Create Event';
  ['ft-title', 'ft-start', 'ft-end', 'ft-link', 'ft-desc'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('ft-max').value = 200;
  document.getElementById('emod').classList.add('open');
}

function oEdit(id) {
  eid = id;
  const e = EV.find(x => x.id === id);
  if(!e) return;
  document.getElementById('emod-t').textContent = 'Edit Event';
  document.getElementById('ft-title').value = e.name;
  document.getElementById('ft-type').value = e.type.toUpperCase(); // Backend expects uppercase ENUM usually
  document.getElementById('ft-status').value = e.status.toUpperCase();
  document.getElementById('ft-start').value = e.startDate;
  document.getElementById('ft-end').value = e.endDate;
  document.getElementById('ft-max').value = e.maxReg;
  document.getElementById('ft-link').value = e.link || '';
  document.getElementById('ft-desc').value = e.desc || '';
  document.getElementById('emod').classList.add('open');
}

async function saveEv() {
  const title = document.getElementById('ft-title').value.trim();
  if(!title) { Toast.show('Title required', 'warning'); return; }
  
  const btn = document.getElementById('esave');
  setLoading(btn, true);
  
  // Construct FormData exactly as the backend expects
  const formData = new FormData();
  formData.append('title', title);
  formData.append('type', document.getElementById('ft-type').value.toUpperCase());
  formData.append('status', document.getElementById('ft-status').value.toUpperCase());
  
  // Spring Boot LocalDateTime expects 'YYYY-MM-DDT00:00:00' format
  const startDate = document.getElementById('ft-start').value;
  if(startDate) formData.append('startTime', startDate + 'T00:00:00');
  
  const endDate = document.getElementById('ft-end').value;
  if(endDate) formData.append('endTime', endDate + 'T23:59:59');
  
  formData.append('capacity', document.getElementById('ft-max').value);
  formData.append('description', document.getElementById('ft-desc').value);
  
  const link = document.getElementById('ft-link').value;
  if(link) formData.append('joinLink', link);

  let result;
  if(eid) {
    // Update existing event
    result = await api.upload(`/events/${eid}`, formData, 'PUT');
  } else {
    // Create new event
    result = await api.upload('/events', formData, 'POST');
  }
  
  setLoading(btn, false);
  if(!result) return; // Error toast handled by api helper
  
  document.getElementById('emod').classList.remove('open');
  Toast.show(eid ? 'Event updated.' : 'Event created.', 'success');
  
  // Reload the table
  loadData();
}

function dEv(id) {
  const e = EV.find(x => x.id === id);
  confirmAction(`Delete <strong>${e?.name}</strong>?`, async () => {
    const result = await api.delete(`/events/${id}`);
    if(result) {
      Toast.show('Deleted successfully.', 'success');
      loadData();
    }
  });
}

// Initial load
document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
