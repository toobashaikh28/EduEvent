<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>EduEvent Admin — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../../css/global.css" />
  </head>
  <body>
    <div id="toast-container"></div>
    <div id="app"></div>
    <script src="../../js/core.js"></script>
    <script src="../../js/components/components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
      if (!Auth.guardPage("ADMIN")) throw new Error("no access");

      document.getElementById("app").innerHTML = `
<div class="admin-shell">
  ${buildAdminSidebar("dashboard.html")}
  ${buildAdminTopbar("Dashboard")}
  <main class="main-content">
    <div class="page-header">
      <div><div class="page-title">Overview</div><div class="page-desc">Platform summary</div></div>
      <button class="btn btn-primary btn-sm" onclick="loadDash()"><i class="ti ti-refresh"></i> Refresh</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;" id="stat-grid">
      ${skeletonCards(5)}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div class="card"><div class="card-header"><div><div class="card-title">Registrations by Event</div><div class="card-subtitle">Live enrollment data</div></div></div><canvas id="chart-reg" style="max-height:200px;"></canvas></div>
      <div class="card"><div class="card-header"><div><div class="card-title">Event Type Breakdown</div></div></div><canvas id="chart-type" style="max-height:200px;"></canvas></div>
    </div>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;">
      <div class="card">
        <div class="card-header"><div class="card-title">Recent Events</div><a href="events.html" class="btn btn-secondary btn-sm">View all</a></div>
        <div id="recent-events"></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">System Activity</div></div>
        <div id="activity"></div>
      </div>
    </div>
  </main>
</div>
${buildNotifPanel()}
${buildUserDropdown()}`;

      // Mock Notifications (Admin notifications usually require a separate WebSocket or specific endpoint not in the guide)
      const NOTIFS = [
        {
          id: 1,
          icon: "ti-trophy",
          color: "#F59E0B",
          bg: "rgba(245,158,11,0.12)",
          title: "Winners announced",
          body: "ML Bootcamp 2025 winners announced.",
          time: "2m ago",
          unread: true,
        },
        {
          id: 2,
          icon: "ti-certificate",
          color: "#22C55E",
          bg: "rgba(34,197,94,0.12)",
          title: "Certificates issued",
          body: "12 certs for Data Science Quiz.",
          time: "1h ago",
          unread: true,
        },
      ];
      initNotifToggle(NOTIFS);
      initAvatarDropdown();
      populateProfile();

      // Store chart instances so we can destroy them on refresh to prevent overlapping
      let regChartInstance = null;
      let typeChartInstance = null;

      async function loadDash() {
        // Fetch real analytics data from the backend concurrently
        const [regData, quizData, dropData, certData, eventsData] =
          await Promise.all([
            api.get("/admin/analytics/registrations").catch(() => []),
            api.get("/admin/analytics/quiz-stats").catch(() => []),
            api.get("/admin/analytics/dropouts").catch(() => []),
            api.get("/admin/analytics/certificates").catch(() => []),
            api.get("/events").catch(() => []), // To populate recent events and the doughnut chart
          ]);

        // --- Calculate Aggregate Stats ---
        let totalReg = 0;
        regData.forEach((r) => (totalReg += r.count || 0));

        let totalDropouts = 0;
        dropData.forEach((d) => (totalDropouts += d.count || 0));

        let totalCerts = 0;
        // If the endpoint returns a list of objects { eventTitle, count }, sum them. If it returns a raw number, use it.
        if (Array.isArray(certData))
          certData.forEach((c) => (totalCerts += c.count || 0));
        else if (typeof certData === "number") totalCerts = certData;

        let avgScore = 0,
          avgPassRate = 0;
        if (quizData && quizData.length > 0) {
          let scoreSum = 0,
            passRateSum = 0;
          quizData.forEach((q) => {
            scoreSum += q.avgScore || 0;
            passRateSum += q.passRate || 0;
          });
          avgScore = (scoreSum / quizData.length).toFixed(1);
          avgPassRate = Math.round(passRateSum / quizData.length);
        }

        // --- Render Stat Grid ---
        document.getElementById("stat-grid").innerHTML = `
    <div class="stat-card c-brand"><div class="stat-label">Total Registrations</div><div class="stat-value">${totalReg}</div><div class="stat-delta up"><i class="ti ti-users"></i> Platform-wide</div></div>
    <div class="stat-card c-teal"><div class="stat-label">Pass Rate</div><div class="stat-value">${avgPassRate}%</div><div class="stat-delta up"><i class="ti ti-check"></i> Average</div></div>
    <div class="stat-card c-amber"><div class="stat-label">Avg Quiz Score</div><div class="stat-value">${avgScore}</div><div class="stat-delta"><i class="ti ti-pencil"></i> / 100</div></div>
    <div class="stat-card c-green"><div class="stat-label">Certificates</div><div class="stat-value">${totalCerts}</div><div class="stat-delta up"><i class="ti ti-certificate"></i> Issued</div></div>
    <div class="stat-card c-red"><div class="stat-label">Dropouts</div><div class="stat-value">${totalDropouts}</div><div class="stat-delta down"><i class="ti ti-door-exit"></i> Cancellations</div></div>`;

        // --- Render Recent Events ---
        if (eventsData.length === 0) {
          document.getElementById("recent-events").innerHTML =
            `<div style="padding:16px;color:var(--text-muted);font-size:13px;">No events created yet.</div>`;
        } else {
          // Sort by start date (newest first) and take top 4
          const sortedEvents = [...eventsData]
            .sort((a, b) => new Date(b.startTime) - new Date(a.startTime))
            .slice(0, 4);
          document.getElementById("recent-events").innerHTML = sortedEvents
            .map((e) => {
              const type = e.type?.toLowerCase() || "event";
              return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid var(--border);">
        <div style="width:8px;height:8px;border-radius:50%;background:var(--accent-${type});flex-shrink:0;"></div>
        <div style="flex:1;"><div style="font-size:13px;font-weight:500;">${e.title}</div><div style="font-size:11px;color:var(--text-muted);">${e.startTime ? fmt.date(e.startTime) : "TBD"}</div></div>
        <span class="badge badge-${type}">${type}</span>
      </div>`;
            })
            .join("");
        }

        // --- Render Activity (Mocked fallback, as this requires a global event bus in Spring Boot) ---
        document.getElementById("activity").innerHTML = `
    <div style="display:flex;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border);">
      <div style="width:30px;height:30px;border-radius:var(--radius-md);background:rgba(79,70,229,0.1);color:#4F46E5;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;"><i class="ti ti-refresh"></i></div>
      <div><div style="font-size:12px;">Analytics dashboard synced</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;">Just now</div></div>
    </div>`;

        // --- CHARTS ---
        Chart.defaults.color = "#9494A8";
        Chart.defaults.borderColor = "rgba(255,255,255,0.06)";
        Chart.defaults.font.family = "'DM Sans',sans-serif";

        // Chart 1: Registrations per Event (Bar Chart mapped to real API data)
        if (regChartInstance) regChartInstance.destroy();
        const regCtx = document.getElementById("chart-reg").getContext("2d");

        const regLabels = regData.map((r) =>
          r.eventTitle.length > 15
            ? r.eventTitle.substring(0, 15) + "..."
            : r.eventTitle,
        );
        const regValues = regData.map((r) => r.count);

        regChartInstance = new Chart(regCtx, {
          type: "bar",
          data: {
            labels: regLabels.length ? regLabels : ["No Data"],
            datasets: [
              {
                data: regValues.length ? regValues : [0],
                backgroundColor: "rgba(79,70,229,0.7)",
                borderColor: "#4F46E5",
                borderWidth: 1,
                borderRadius: 4,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
          },
        });

        // Chart 2: Event Type Breakdown (Doughnut mapped to real event types)
        if (typeChartInstance) typeChartInstance.destroy();

        // Calculate totals per type
        let typeCounts = { hackathon: 0, conference: 0, quiz: 0, webinar: 0 };
        eventsData.forEach((e) => {
          const t = e.type?.toLowerCase();
          if (typeCounts[t] !== undefined) typeCounts[t]++;
        });

        typeChartInstance = new Chart(document.getElementById("chart-type"), {
          type: "doughnut",
          data: {
            labels: ["Hackathons", "Conferences", "Quizzes", "Webinars"],
            datasets: [
              {
                data: [
                  typeCounts.hackathon,
                  typeCounts.conference,
                  typeCounts.quiz,
                  typeCounts.webinar,
                ],
                backgroundColor: [
                  "rgba(217,70,239,0.7)", // Hackathon
                  "rgba(20,184,166,0.7)", // Conference
                  "rgba(245,158,11,0.7)", // Quiz
                  "rgba(59,130,246,0.7)", // Webinar
                ],
                borderColor: ["#D946EF", "#14B8A6", "#F59E0B", "#3B82F6"],
                borderWidth: 1,
              },
            ],
          },
          options: {
            responsive: true,
            cutout: "65%",
            plugins: {
              legend: {
                position: "bottom",
                labels: { padding: 14, boxWidth: 12 },
              },
            },
          },
        });
      }

      document.addEventListener("DOMContentLoaded", loadDash);
    </script>
  </body>
</html>
