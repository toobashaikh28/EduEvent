<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>EduEvent — Certificates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- Certificate fonts loaded separately so they're available inside the cert canvas -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/global.css">
  <!-- PDF generation libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
    .cc{background:var(--bg-card);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:var(--transition);}
    .cc:hover{border-color:var(--border-hover);transform:translateY(-2px);}
    .cb{height:88px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;}
    .cb.hack{background:linear-gradient(135deg,rgba(217,70,239,0.2),rgba(79,70,229,0.15));}
    .cb.quiz{background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(239,68,68,0.12));}
    .cb.conf{background:linear-gradient(135deg,rgba(20,184,166,0.2),rgba(59,130,246,0.15));}
    .cb.web{background:linear-gradient(135deg,rgba(59,130,246,0.2),rgba(99,102,241,0.12));}

    /* ── Modal overlay ── */
    .cprev{position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
    .cprev.open{display:flex;}
    .cdoc{background:var(--bg-card);border:0.5px solid var(--border-hover);border-radius:var(--radius-xl);width:100%;max-width:720px;overflow:hidden;animation:modalIn 0.2s ease;}
    @keyframes modalIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}

    /* ── Certificate canvas ── */
    #cert-canvas-wrap{padding:24px 28px;}
    #cert-canvas{
      width:100%;
      aspect-ratio:1.414/1; /* A4 landscape ratio */
      background:#0e1018;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.08);
      position:relative;
      overflow:hidden;
      font-family:'Outfit',sans-serif;
    }
    /* Decorative corner SVG overlays */
    #cert-canvas .corner{position:absolute;width:140px;height:140px;opacity:0.55;}
    #cert-canvas .corner.tl{top:0;left:0;}
    #cert-canvas .corner.tr{top:0;right:0;transform:scaleX(-1);}
    #cert-canvas .corner.bl{bottom:0;left:0;transform:scaleY(-1);}
    #cert-canvas .corner.br{bottom:0;right:0;transform:scale(-1,-1);}
    #cert-canvas .bg-glow{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;}
    #cert-canvas .cert-body{
      position:relative;
      z-index:2;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:30px 48px;
      gap:0;
    }
    .cert-org{font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(165,180,252,0.7);margin-bottom:10px;}
    .cert-headline{font-family:'Playfair Display',serif;font-size:clamp(13px,2.8vw,22px);font-weight:700;color:#e8ecf5;margin-bottom:8px;line-height:1.2;}
    .cert-subline{font-size:clamp(9px,1.4vw,11px);color:rgba(255,255,255,0.4);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;}
    .cert-name{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(18px,4.5vw,34px);font-weight:400;color:#fff;margin-bottom:12px;line-height:1.1;}
    .cert-divider{width:60px;height:2px;border-radius:2px;margin:0 auto 12px;background:linear-gradient(90deg,transparent,currentColor,transparent);}
    .cert-event-label{font-size:clamp(8px,1.3vw,11px);color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:2px;margin-bottom:5px;}
    .cert-event-name{font-family:'Playfair Display',serif;font-size:clamp(13px,2.5vw,19px);font-weight:700;margin-bottom:16px;}
    .cert-desc{font-size:clamp(8px,1.2vw,11px);color:rgba(255,255,255,0.45);line-height:1.6;max-width:80%;margin:0 auto 18px;}
    .cert-footer{display:flex;align-items:flex-end;justify-content:space-between;width:100%;margin-top:auto;}
    .cert-footer-block{text-align:center;}
    .cert-footer-line{width:80px;height:1px;background:rgba(255,255,255,0.2);margin:0 auto 5px;}
    .cert-footer-label{font-size:clamp(7px,1vw,9px);color:rgba(255,255,255,0.35);letter-spacing:1px;text-transform:uppercase;}
    .cert-seal{width:clamp(36px,6vw,54px);height:clamp(36px,6vw,54px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:clamp(14px,2.5vw,20px);font-weight:700;color:#fff;flex-shrink:0;}
    .cert-uuid{font-family:'DM Mono',monospace;font-size:clamp(6px,0.9vw,9px);color:rgba(255,255,255,0.25);letter-spacing:0.5px;}
  </style>
</head>
<body>
<div id="toast-container"></div><div id="app"></div>
<script src="../../js/core.js"></script>
<script src="../../js/components/components.js"></script>
<script>
if(!Auth.guardPage('USER'))throw new Error();

document.getElementById('app').innerHTML=`<div class="page-shell">
${buildTopnav('USER','certificates.html')}
<div class="page-content">
  <div class="page-header"><div><div class="page-title">My Certificates</div><div class="page-desc">Your earned credentials and achievements</div></div></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;" id="cs-stats">
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
  </div>
  <div class="cg" id="cg"></div>
  <div id="ce" style="display:none;">
    <div class="empty-state" style="padding:80px;">
      <div class="empty-icon"><i class="ti ti-certificate-off"></i></div>
      <div class="empty-title">No certificates yet</div>
      <div class="empty-desc">Complete events and quizzes to earn certificates.</div>
      <button class="btn btn-primary" style="margin-top:8px;" onclick="window.location.href='events.html'"><i class="ti ti-calendar-event"></i> Browse Events</button>
    </div>
  </div>
</div></div>${buildNotifPanel()}${buildUserDropdown()}

<!-- Certificate Preview Modal -->
<div class="cprev" id="cprev" onclick="if(event.target===this)closePrev()">
  <div class="cdoc">
    <!-- Rendered certificate -->
    <div id="cert-canvas-wrap">
      <div id="cert-canvas">
        <!-- bg glows -->
        <div class="bg-glow" id="glow1" style="width:320px;height:320px;top:-80px;left:-80px;"></div>
        <div class="bg-glow" id="glow2" style="width:240px;height:240px;bottom:-60px;right:-60px;"></div>
        <!-- corner ornaments (inline SVG) -->
        <svg class="corner tl" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 0 L140 0 L140 10 Q10 10 10 140 L0 140 Z" fill="rgba(255,255,255,0.04)"/>
          <path d="M0 0 L60 0 Q4 4 0 60 Z" fill="rgba(255,255,255,0.06)"/>
          <circle cx="8" cy="8" r="3" fill="rgba(255,255,255,0.15)"/>
          <circle cx="20" cy="8" r="1.5" fill="rgba(255,255,255,0.08)"/>
          <circle cx="8" cy="20" r="1.5" fill="rgba(255,255,255,0.08)"/>
        </svg>
        <svg class="corner tr" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 0 L140 0 L140 140 Q130 10 0 10 Z" fill="rgba(255,255,255,0.04)"/>
          <path d="M140 0 L80 0 Q136 4 140 60 Z" fill="rgba(255,255,255,0.06)"/>
          <circle cx="132" cy="8" r="3" fill="rgba(255,255,255,0.15)"/>
          <circle cx="120" cy="8" r="1.5" fill="rgba(255,255,255,0.08)"/>
          <circle cx="132" cy="20" r="1.5" fill="rgba(255,255,255,0.08)"/>
        </svg>
        <svg class="corner bl" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 140 L0 0 L10 0 Q10 130 140 130 L140 140 Z" fill="rgba(255,255,255,0.04)"/>
          <path d="M0 140 L0 80 Q4 136 60 140 Z" fill="rgba(255,255,255,0.06)"/>
          <circle cx="8" cy="132" r="3" fill="rgba(255,255,255,0.15)"/>
        </svg>
        <svg class="corner br" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M140 140 L0 140 L0 130 Q130 130 130 0 L140 0 Z" fill="rgba(255,255,255,0.04)"/>
          <path d="M140 140 L80 140 Q136 136 140 80 Z" fill="rgba(255,255,255,0.06)"/>
          <circle cx="132" cy="132" r="3" fill="rgba(255,255,255,0.15)"/>
        </svg>
        <!-- Certificate body -->
        <div class="cert-body">
          <div class="cert-org">EduEvent Platform</div>
          <div class="cert-headline">Certificate of Achievement</div>
          <div class="cert-subline">This is to certify that</div>
          <div class="cert-name" id="cv-name">—</div>
          <div class="cert-divider" id="cv-divider"></div>
          <div class="cert-event-label">has successfully completed</div>
          <div class="cert-event-name" id="cv-event">—</div>
          <div class="cert-desc" id="cv-desc">—</div>
          <div class="cert-footer">
            <div class="cert-footer-block">
              <div class="cert-footer-line"></div>
              <div class="cert-footer-label" id="cv-date">—</div>
              <div style="font-size:8px;color:rgba(255,255,255,0.2);margin-top:2px;">Issue Date</div>
            </div>
            <div class="cert-seal" id="cv-seal">E</div>
            <div class="cert-footer-block">
              <div class="cert-footer-line"></div>
              <div class="cert-uuid" id="cv-uuid">—</div>
              <div style="font-size:8px;color:rgba(255,255,255,0.2);margin-top:2px;">Verification ID</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Modal actions -->
    <div style="padding:14px 24px;border-top:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:26px;height:26px;background:var(--brand);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:12px;color:#fff;">E</div>
        <div>
          <div style="font-size:12px;font-weight:600;">EduEvent Platform</div>
          <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);" id="prev-id">—</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary btn-sm" onclick="closePrev()">Close</button>
        <button class="btn btn-primary btn-sm" id="dl-btn" onclick="dlCert()">
          <i class="ti ti-download"></i> Download PDF
        </button>
      </div>
    </div>
  </div>
</div>`;

initNotifToggle([]);initAvatarDropdown();populateProfile();

let CERTS = [];
const bgs={hack:'hack',quiz:'quiz',conf:'conf',web:'web'};

// Gradient palettes per cert type
const PALETTES = {
  hack: { bg:'#0e0818', glow1:'rgba(139,92,246,0.4)', glow2:'rgba(217,70,239,0.3)', accent:'#A78BFA', seal:'linear-gradient(135deg,#7C3AED,#D946EF)', divider:'#A78BFA' },
  quiz: { bg:'#0f0e08', glow1:'rgba(245,158,11,0.35)', glow2:'rgba(239,68,68,0.2)',  accent:'#FCD34D', seal:'linear-gradient(135deg,#D97706,#EF4444)', divider:'#FCD34D' },
  conf: { bg:'#08100f', glow1:'rgba(20,184,166,0.35)', glow2:'rgba(59,130,246,0.25)', accent:'#5EEAD4', seal:'linear-gradient(135deg,#0D9488,#3B82F6)', divider:'#5EEAD4' },
  web:  { bg:'#080e18', glow1:'rgba(59,130,246,0.35)', glow2:'rgba(99,102,241,0.25)', accent:'#93C5FD', seal:'linear-gradient(135deg,#2563EB,#6366F1)', divider:'#93C5FD' },
};

const pbg={'Earned':'rgba(34,197,94,0.15)','2nd Place':'rgba(245,158,11,0.15)','Passed':'rgba(34,197,94,0.15)','Attendee':'rgba(79,70,229,0.15)','1st Place':'rgba(245,158,11,0.2)','3rd Place':'rgba(180,83,9,0.15)'};
const ptc={'Earned':'#4ADE80','2nd Place':'#FCD34D','Passed':'#4ADE80','Attendee':'#A5B4FC','1st Place':'#FCD34D','3rd Place':'#D97706'};
let activeCert = null;

async function loadCerts() {
  const data = await api.get('/users/me/certificates');
  if (!data || data.length === 0) {
    document.getElementById('cs-stats').innerHTML='';
    document.getElementById('cg').innerHTML='';
    document.getElementById('ce').style.display='';
    return;
  }
  CERTS = data.map(c => {
    const t = (c.eventTitle || '').toLowerCase();
    let type = 'conf', emoji = '🏆';
    if(t.includes('hack') || t.includes('bootcamp')) { type = 'hack'; emoji = '🥈'; }
    else if(t.includes('quiz')) { type = 'quiz'; emoji = '📝'; }
    else if(t.includes('webinar')) { type = 'web'; emoji = '💻'; }
    return {
      id: c.id, uuid: c.certUuid, name: c.participantName,
      type, place: 'Earned', event: c.eventTitle, date: c.issuedAt, emoji,
      desc: `Issued to ${c.participantName} for successful participation in ${c.eventTitle}.`
    };
  });
  document.getElementById('ce').style.display='none';
  render();
}

function render() {
  document.getElementById('cs-stats').innerHTML=`
    <div class="stat-card c-amber"><div class="stat-label">Total Earned</div><div class="stat-value">${CERTS.length}</div></div>
    <div class="stat-card c-hack"><div class="stat-label">Hackathons</div><div class="stat-value">${CERTS.filter(c=>c.type==='hack').length}</div></div>
    <div class="stat-card c-green"><div class="stat-label">Quizzes Passed</div><div class="stat-value">${CERTS.filter(c=>c.type==='quiz').length}</div></div>`;

  document.getElementById('cg').innerHTML=CERTS.map(c=>`
    <div class="cc">
      <div class="cb ${bgs[c.type]||'web'}">
        <span style="font-size:30px;">${c.emoji}</span>
        <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:${pbg[c.place]||'rgba(79,70,229,0.15)'};color:${ptc[c.place]||'#A5B4FC'};">${c.place}</span>
      </div>
      <div style="padding:13px 15px;">
        <div style="font-weight:600;font-size:13px;margin-bottom:2px;">${c.event}</div>
        <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;">Certificate of Achievement</div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);">${c.uuid.substring(0,8)} · ${fmt.date(c.date)}</div>
      </div>
      <div style="padding:10px 14px;border-top:0.5px solid var(--border);display:flex;gap:7px;">
        <button class="btn btn-secondary btn-sm" style="flex:1;justify-content:center;" onclick="prevCert(${c.id})"><i class="ti ti-eye"></i> Preview</button>
        <button class="btn btn-primary btn-sm" style="flex:1;justify-content:center;" onclick="dlById(${c.id})"><i class="ti ti-download"></i> PDF</button>
      </div>
    </div>`).join('');
}

function applyCertTheme(type) {
  const p = PALETTES[type] || PALETTES.conf;
  const canvas = document.getElementById('cert-canvas');
  canvas.style.background = p.bg;
  document.getElementById('glow1').style.background = p.glow1;
  document.getElementById('glow2').style.background = p.glow2;
  document.getElementById('cv-divider').style.background = `linear-gradient(90deg,transparent,${p.accent},transparent)`;
  document.getElementById('cv-divider').style.color = p.accent;
  const seal = document.getElementById('cv-seal');
  seal.style.background = p.seal;
  seal.style.boxShadow = `0 0 20px ${p.glow1}`;
  // event name color
  document.getElementById('cv-event').style.color = p.accent;
}

function prevCert(id) {
  activeCert = CERTS.find(c=>c.id===id);
  if(!activeCert) return;

  applyCertTheme(activeCert.type);

  document.getElementById('cv-name').textContent  = activeCert.name;
  document.getElementById('cv-event').textContent = activeCert.event;
  document.getElementById('cv-desc').textContent  = activeCert.desc;
  document.getElementById('cv-date').textContent  = fmt.date(activeCert.date);
  document.getElementById('cv-uuid').textContent  = activeCert.uuid;
  document.getElementById('prev-id').textContent  = activeCert.uuid;
  document.getElementById('cv-seal').textContent  = 'E';

  document.getElementById('cprev').classList.add('open');
}

function closePrev() {
  document.getElementById('cprev').classList.remove('open');
}

async function dlCert() {
  if(!activeCert) return;
  const btn = document.getElementById('dl-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i> Generating…';

  try {
    // Try real backend PDF first
    const TOKEN = localStorage.getItem('edu_token');
    const res = await fetch(`/api/certificates/${activeCert.id}/download`, {
      headers: TOKEN ? { Authorization: `Bearer ${TOKEN}` } : {}
    });

    if (res.ok) {
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `Certificate_${activeCert.event.replace(/\s+/g,'_')}.pdf`;
      a.click(); URL.revokeObjectURL(url);
      Toast.show('Certificate downloaded!', 'success');
    } else {
      // Fallback: render the on-screen canvas to PDF with html2canvas + jsPDF
      await generateClientPDF();
    }
  } catch(e) {
    await generateClientPDF();
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-download"></i> Download PDF';
}

async function generateClientPDF() {
  const { jsPDF } = window.jspdf;
  const canvas = document.getElementById('cert-canvas');

  Toast.show('Rendering certificate…', 'info');

  // Wait a frame so fonts are settled
  await new Promise(r => setTimeout(r, 200));

  const imgCanvas = await html2canvas(canvas, {
    scale: 3,           // 3× for crisp print quality
    useCORS: true,
    backgroundColor: null,
    logging: false,
  });

  const imgData = imgCanvas.toDataURL('image/png');
  const pdf = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  pdf.addImage(imgData, 'PNG', 0, 0, 297, 210); // A4 landscape exact fit
  pdf.save(`EduEvent_Certificate_${activeCert.name.replace(/\s+/g,'_')}.pdf`);
  Toast.show('PDF saved!', 'success');
}

async function dlById(id) {
  activeCert = CERTS.find(c=>c.id===id);
  if(!activeCert) return;
  // Silently populate the hidden canvas so html2canvas has something to render
  applyCertTheme(activeCert.type);
  document.getElementById('cv-name').textContent  = activeCert.name;
  document.getElementById('cv-event').textContent = activeCert.event;
  document.getElementById('cv-desc').textContent  = activeCert.desc;
  document.getElementById('cv-date').textContent  = fmt.date(activeCert.date);
  document.getElementById('cv-uuid').textContent  = activeCert.uuid;
  document.getElementById('cv-seal').textContent  = 'E';

  // Briefly show modal so canvas renders, then trigger download
  document.getElementById('cprev').classList.add('open');
  await new Promise(r => setTimeout(r, 150));
  const btn = document.getElementById('dl-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i> Generating…';
  await generateClientPDF();
  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-download"></i> Download PDF';
  document.getElementById('cprev').classList.remove('open');
}

// ── Called from quiz.html result screen after passing ──────────────────────
// Usage: window.opener / history state passes { name, event, uuid, type, date }
function showCertFromQuiz(certData) {
  const synth = {
    id: certData.id || 0,
    uuid: certData.uuid || 'PENDING',
    name: certData.name,
    type: certData.type || 'quiz',
    place: 'Passed',
    event: certData.event,
    date: certData.date || new Date().toISOString(),
    emoji: '📝',
    desc: `Awarded to ${certData.name} for successfully passing the ${certData.event} quiz.`
  };
  activeCert = synth;
  applyCertTheme(synth.type);
  document.getElementById('cv-name').textContent  = synth.name;
  document.getElementById('cv-event').textContent = synth.event;
  document.getElementById('cv-desc').textContent  = synth.desc;
  document.getElementById('cv-date').textContent  = fmt.date(synth.date);
  document.getElementById('cv-uuid').textContent  = synth.uuid;
  document.getElementById('prev-id').textContent  = synth.uuid;
  document.getElementById('cv-seal').textContent  = 'E';
  document.getElementById('cprev').classList.add('open');
}

// Expose globally so quiz.html result screen can call it via redirect
window._autoOpenCert = function() {
  const raw = sessionStorage.getItem('edu_new_cert');
  if(!raw) return;
  sessionStorage.removeItem('edu_new_cert');
  try { showCertFromQuiz(JSON.parse(raw)); } catch(e){}
};

// Also add spin keyframe for the loader icon
const st = document.createElement('style');
st.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
document.head.appendChild(st);

document.addEventListener('DOMContentLoaded', () => {
  loadCerts();
  window._autoOpenCert();
});
</script>
</body>
</html>
